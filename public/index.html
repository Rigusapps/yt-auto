<!-- Form Jadwal Video Baru -->
    <div class="bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80">
      <div class="flex items-center gap-2 mb-6 border-b border-slate-100 pb-3">
        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <h2 class="text-base sm:text-xl font-bold text-slate-900">Jadwalkan Video Baru</h2>
      </div>

      <form id="uploadForm" class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">

        <!-- Channel Tujuan & Pilih Video dibuat Sejajar (2 Kolom) -->
        <div class="space-y-1.5">
          <label class="block text-xs sm:text-sm font-semibold text-slate-700">Pilih Channel Tujuan</label>
          <select name="channel_id" id="channelSelect" required class="w-full border border-slate-200 text-xs sm:text-sm p-3 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all cursor-pointer">
            <option value="">-- Pilih Channel --</option>
          </select>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs sm:text-sm font-semibold text-slate-700">Pilih Video</label>
          <div class="relative border border-slate-200 rounded-xl p-2.5 sm:p-3 text-center hover:border-indigo-400 transition-colors bg-slate-50/50 flex items-center justify-center">
            <input type="file" name="video" accept="video/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
            <div class="flex items-center justify-center gap-2 pointer-events-none">
              <svg class="w-5 h-5 text-indigo-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
              <span class="text-xs sm:text-sm text-slate-600 font-medium truncate">Pilih / Drag file video di sini</span>
            </div>
          </div>
        </div>

        <!-- Input Baris Berikutnya -->
        <div>
          <label class="block text-xs sm:text-sm font-semibold mb-1.5 text-slate-700">Judul Video</label>
          <input type="text" name="title" required class="w-full border border-slate-200 text-xs sm:text-sm p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400" placeholder="Judul video...">
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-semibold mb-1.5 text-slate-700">Waktu Tayang (Jadwal)</label>
          <input type="datetime-local" name="scheduled_at" required class="w-full border border-slate-200 text-xs sm:text-sm p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-800">
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-semibold mb-1.5 text-slate-700">Status Privasi</label>
          <select name="privacy_status" class="w-full border border-slate-200 text-xs sm:text-sm p-3 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all cursor-pointer">
            <option value="public">Public</option>
            <option value="private">Private</option>
            <option value="unlisted">Unlisted</option>
          </select>
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-semibold mb-1.5 text-slate-700">Tags (Pisahkan koma)</label>
          <input type="text" name="tags" class="w-full border border-slate-200 text-xs sm:text-sm p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400" placeholder="gaming, tutorial, nodejs">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs sm:text-sm font-semibold mb-1.5 text-slate-700">Deskripsi</label>
          <textarea name="description" rows="3" class="w-full border border-slate-200 text-xs sm:text-sm p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400" placeholder="Deskripsi video..."></textarea>
        </div>

        <div class="md:col-span-2 pt-2">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3.5 rounded-xl font-semibold text-xs sm:text-sm w-full cursor-pointer transition-all duration-200 shadow-sm shadow-indigo-200 active:scale-[0.99] flex items-center justify-center gap-2">
            <span>Masukkan ke Antrean</span>
          </button>
        </div>
      </form>
    </div>
