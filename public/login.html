<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - YouTube Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 id="formTitle" class="text-2xl font-bold mb-6 text-center text-gray-800">Login User</h2>
    
    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700">Username</label>
        <input type="text" id="username" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Input Tambahan Khusus Mode Register -->
      <div id="extraFields" class="hidden space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-gray-700">Email</label>
          <input type="email" id="email" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="contoh@gmail.com">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-gray-700">No. WhatsApp</label>
          <input type="text" id="whatsapp" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="08123456789">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700">Password</label>
        <div class="relative">
          <input type="password" id="password" required class="w-full border p-2 pr-10 rounded focus:ring-2 focus:ring-blue-500 outline-none">
          
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700 cursor-pointer focus:outline-none">
            <svg id="eyeOpen" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg id="eyeClosed" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.018 10.018 0 013.837-.838c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-3.148-3.148A3 3 0 0012 9a2.99 2.99 0 00-1.848.641M15 12a3 3 0 01-3 3" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition cursor-pointer">
        Login
      </button>
    </form>

    <div class="mt-4 text-center text-sm text-gray-600">
      <span id="toggleText">Belum punya akun?</span>
      <button id="toggleBtn" onclick="toggleMode()" class="text-blue-600 font-semibold underline ml-1 cursor-pointer">Daftar Sekarang</button>
    </div>
  </div>

  <script>
    let isLogin = true;

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
      } else {
        passwordInput.type = 'password';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
      }
    }

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('formTitle').innerText = isLogin ? 'Login User' : 'Pendaftaran Akun Baru';
      document.getElementById('submitBtn').innerText = isLogin ? 'Login' : 'Daftar';
      document.getElementById('toggleText').innerText = isLogin ? 'Belum punya akun?' : 'Sudah punya akun?';
      document.getElementById('toggleBtn').innerText = isLogin ? 'Daftar Sekarang' : 'Login';

      const extraFields = document.getElementById('extraFields');
      const emailInput = document.getElementById('email');
      const waInput = document.getElementById('whatsapp');

      if (isLogin) {
        extraFields.classList.add('hidden');
        emailInput.removeAttribute('required');
        waInput.removeAttribute('required');
      } else {
        extraFields.classList.remove('hidden');
        emailInput.setAttribute('required', 'true');
        waInput.setAttribute('required', 'true');
      }
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const email = document.getElementById('email').value;
      const whatsapp = document.getElementById('whatsapp').value;

      const endpoint = isLogin ? '/api/login' : '/api/register';
      const bodyPayload = isLogin 
        ? { username, password } 
        : { username, password, email, whatsapp };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyPayload)
        });

        const data = await res.json();
        if (res.ok) {
          if (isLogin) {
            window.location.href = '/';
          } else {
            alert(data.message);
            toggleMode();
          }
        } else {
          alert(data.error || 'Terjadi kesalahan!');
        }
      } catch (err) {
        alert('Gagal terhubung ke server: ' + err.message);
      }
    });
  </script>
</body>
</html>
